<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>메모리 매치</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; font-family: "Malgun Gothic", system-ui, sans-serif; color: #eef2ff; user-select: none; -webkit-user-select: none; }
  body { background: radial-gradient(ellipse at 50% 0%, #1d3f8a 0%, #0a1230 60%, #060a1c 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
  .back { position: fixed; left: 12px; top: 10px; z-index: 5; color: #e5e9ff; text-decoration: none; font-size: 14px; background: rgba(255,255,255,.1); padding: 7px 14px; border-radius: 20px; }
  h1 { margin: 54px 0 4px; font-size: clamp(30px, 6vw, 46px); font-weight: 900; letter-spacing: 3px; background: linear-gradient(90deg, #8fb8ff, #ffffff, #8fb8ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .levels { display: flex; gap: 8px; margin: 10px 0 14px; }
  .levels button { font: inherit; font-weight: 700; color: #cfe0ff; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15); padding: 8px 18px; border-radius: 20px; cursor: pointer; }
  .levels button.on { background: #8fb8ff; color: #0a1230; border-color: #8fb8ff; }
  .stats { display: flex; gap: 22px; font-size: 15px; color: #cfe0ff; margin-bottom: 14px; }
  .stats b { color: #fff; font-size: 18px; }
  #combo { color: #ffd166; font-weight: 800; min-width: 80px; text-align: center; transition: transform .2s; }
  #board { display: grid; gap: var(--gap); padding: 0 12px 30px; perspective: 900px; }
  .card { width: var(--size); height: calc(var(--size) * 1.25); position: relative; cursor: pointer; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.2,.8,.3,1.2); }
  .card.flip, .card.done { transform: rotateY(180deg); }
  .card.done { cursor: default; }
  .face { position: absolute; inset: 0; border-radius: 12px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; align-items: center; justify-content: center; }
  .front { background: linear-gradient(135deg, #2a4fb0, #4a2a90); border: 2px solid rgba(255,255,255,.18); box-shadow: 0 6px 14px rgba(0,0,0,.35); }
  .front::after { content: "?"; font-size: calc(var(--size) * 0.42); font-weight: 900; color: rgba(255,255,255,.25); }
  .front::before { content: ""; position: absolute; inset: 6px; border-radius: 8px; border: 1px dashed rgba(255,255,255,.2); }
  .card:hover:not(.flip):not(.done) .front { filter: brightness(1.2); }
  .back-face { background: #f4f7ff; transform: rotateY(180deg); font-size: calc(var(--size) * 0.55); box-shadow: 0 6px 14px rgba(0,0,0,.35); }
  .card.done .back-face { background: linear-gradient(135deg, #d9ffe9, #b9f5d4); box-shadow: 0 0 20px rgba(80,255,170,.5); animation: pop .4s; }
  .card.wrong .back-face { background: #ffd9e0; animation: shakeX .4s; }
  @keyframes pop { 50% { transform: rotateY(180deg) scale(1.15); } }
  @keyframes shakeX { 25% { transform: rotateY(180deg) translateX(-6px); } 75% { transform: rotateY(180deg) translateX(6px); } }
  #win { position: fixed; inset: 0; background: rgba(5,8,25,.75); display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); z-index: 10; }
  #win.show { display: flex; }
  .panel { background: linear-gradient(180deg, #1b2a6b, #10183f); border: 1px solid rgba(255,255,255,.15); border-radius: 20px; padding: 30px 40px; text-align: center; animation: rise .4s; }
  @keyframes rise { from { transform: translateY(30px) scale(.9); opacity: 0; } }
  .panel h2 { margin: 0 0 6px; font-size: 34px; }
  .stars { font-size: 40px; letter-spacing: 6px; margin: 6px 0 10px; }
  .panel p { margin: 6px 0; font-size: 17px; color: #cfe0ff; }
  .panel button { margin-top: 16px; font: inherit; font-weight: 800; font-size: 17px; background: #8fb8ff; color: #0a1230; border: 0; padding: 11px 28px; border-radius: 24px; cursor: pointer; }
  .confetti { position: fixed; top: -20px; width: 10px; height: 14px; z-index: 11; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
</style>
</head>
<body>
<a class="back" href="../index.html">← 게임 목록</a>
<h1>MEMORY MATCH</h1>
<div class="levels">
  <button data-lv="easy">쉬움 (6쌍)</button>
  <button data-lv="normal" class="on">보통 (8쌍)</button>
  <button data-lv="hard">어려움 (15쌍)</button>
</div>
<div class="stats">
  <span>시간 <b id="time">0.0</b>초</span>
  <span>시도 <b id="moves">0</b></span>
  <span>짝 <b id="pairs">0/8</b></span>
  <span id="combo"></span>
</div>
<div id="board"></div>
<div id="win"><div class="panel">
  <h2>🎉 클리어!</h2>
  <div class="stars" id="stars"></div>
  <p id="result"></p>
  <p id="record" style="color:#ffd166"></p>
  <button id="again">다시 하기</button>
</div></div>
<script>
(() => {
const ICONS = ['✈️', '🚀', '🛸', '🚁', '⛵', '🚂', '🏎️', '🚲', '🎈', '🛶', '🚒', '🚜', '🛵', '🚌', '🚤', '🚗', '🚑', '🛴'];
const LV = { easy: { pairs: 6, cols: 4 }, normal: { pairs: 8, cols: 4 }, hard: { pairs: 15, cols: 6 } };
const $ = id => document.getElementById(id);
let lv = 'normal', cards = [], open = [], lock = false, moves = 0, matched = 0, combo = 0, startT = 0, timer = 0, elapsed = 0;

let actx = null;
function beep(f, d, type = 'triangle', v = 0.05, slide = 0) {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(actx.destination); o.start(); o.stop(t + d);
}
const getBest = l => { try { return +localStorage.getItem('memory_best_' + l) || 0; } catch (e) { return 0; } };

function layout() {
  const { cols, pairs } = LV[lv], rows = Math.ceil(pairs * 2 / cols);
  const gap = 10, availW = Math.min(innerWidth - 24, 760), availH = innerHeight - 230;
  const size = Math.max(54, Math.min((availW - gap * (cols - 1)) / cols, (availH - gap * (rows - 1)) / rows / 1.25, 130));
  const b = $('board'); b.style.setProperty('--size', size + 'px'); b.style.setProperty('--gap', gap + 'px'); b.style.gridTemplateColumns = `repeat(${cols}, var(--size))`;
}
function newGame() {
  clearInterval(timer); $('win').classList.remove('show');
  const { pairs } = LV[lv];
  const pick = [...ICONS].sort(() => Math.random() - 0.5).slice(0, pairs);
  const deck = [...pick, ...pick].sort(() => Math.random() - 0.5);
  const b = $('board'); b.innerHTML = '';
  cards = deck.map((icon, i) => {
    const el = document.createElement('div'); el.className = 'card';
    el.innerHTML = `<div class="face front"></div><div class="face back-face">${icon}</div>`;
    const c = { el, icon, done: false };
    el.addEventListener('click', () => flip(c));
    b.appendChild(el);
    el.style.opacity = 0; el.style.transform = 'translateY(20px)';
    setTimeout(() => { el.style.transition = 'transform .45s cubic-bezier(.2,.8,.3,1.2), opacity .3s'; el.style.opacity = 1; el.style.transform = ''; }, 20 + i * 25);
    return c;
  });
  open = []; lock = false; moves = 0; matched = 0; combo = 0; startT = 0; elapsed = 0;
  layout(); updateStats();
}
function updateStats() {
  $('time').textContent = (elapsed / 1000).toFixed(1);
  $('moves').textContent = moves;
  $('pairs').textContent = `${matched}/${LV[lv].pairs}`;
  $('combo').textContent = combo >= 2 ? `🔥 ${combo} 연속!` : '';
}
function flip(c) {
  if (lock || c.done || open.includes(c)) return;
  if (!startT) { startT = performance.now(); timer = setInterval(() => { elapsed = performance.now() - startT; updateStats(); }, 100); }
  c.el.classList.add('flip'); open.push(c); beep(500, 0.06, 'sine', 0.04);
  if (open.length < 2) return;
  moves++; const [a, b] = open;
  if (a.icon === b.icon) {
    a.done = b.done = true; matched++; combo++; open = [];
    setTimeout(() => { a.el.classList.add('done'); b.el.classList.add('done'); }, 250);
    beep(660 + combo * 80, 0.12, 'triangle', 0.06); setTimeout(() => beep(990 + combo * 80, 0.15, 'triangle', 0.05), 90);
    if (matched === LV[lv].pairs) setTimeout(win, 700);
  } else {
    lock = true; combo = 0;
    setTimeout(() => { a.el.classList.add('wrong'); b.el.classList.add('wrong'); beep(200, 0.15, 'square', 0.03); }, 350);
    setTimeout(() => { for (const c of [a, b]) c.el.classList.remove('flip', 'wrong'); open = []; lock = false; }, 950);
  }
  updateStats();
}
function win() {
  clearInterval(timer); elapsed = performance.now() - startT; updateStats();
  const p = LV[lv].pairs, star = moves <= p * 1.4 ? 3 : moves <= p * 2 ? 2 : 1;
  $('stars').textContent = '★'.repeat(star) + '☆'.repeat(3 - star);
  $('stars').style.color = '#ffd166';
  $('result').textContent = `${(elapsed / 1000).toFixed(1)}초 · 시도 ${moves}회`;
  const t = Math.round(elapsed / 100), prev = getBest(lv);
  if (!prev || t < prev) { try { localStorage.setItem('memory_best_' + lv, t); } catch (e) {} $('record').textContent = '🏆 최고 기록 달성!'; }
  else $('record').textContent = `최고 기록 ${(prev / 10).toFixed(1)}초`;
  $('win').classList.add('show');
  [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.18, 'triangle', 0.06), i * 120));
  const cols = ['#ffd166', '#ff6b9a', '#7fe8ff', '#9effa0', '#b388ff'];
  for (let i = 0; i < 70; i++) {
    const d = document.createElement('div'); d.className = 'confetti';
    d.style.left = Math.random() * 100 + 'vw'; d.style.background = cols[i % cols.length];
    d.style.animationDuration = 1.8 + Math.random() * 1.8 + 's'; d.style.animationDelay = Math.random() * 0.6 + 's';
    document.body.appendChild(d); d.addEventListener('animationend', () => d.remove());
  }
}
document.querySelectorAll('.levels button').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('.levels button').forEach(b => b.classList.toggle('on', b === btn));
  lv = btn.dataset.lv; newGame();
}));
$('again').addEventListener('click', newGame);
addEventListener('resize', layout);
newGame();
})();
</script>
</body>
</html>
