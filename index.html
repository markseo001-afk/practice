<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미니 게임 아케이드</title>
<style>
  :root { --bg: #070912; --card: #121735; --text: #eef2ff; --muted: #9aa6cf; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; }
  body { background: radial-gradient(ellipse at 20% 0%, #1b2a6b 0%, transparent 55%), radial-gradient(ellipse at 90% 30%, #4a1d5e 0%, transparent 50%), var(--bg); background-attachment: fixed; }
  header { text-align: center; padding: 56px 16px 28px; }
  h1 { margin: 0; font-size: clamp(34px, 7vw, 60px); font-weight: 900; letter-spacing: 3px;
       background: linear-gradient(90deg, #7fe8ff, #b388ff, #ff7ac6); -webkit-background-clip: text; background-clip: text; color: transparent; }
  header p { margin: 10px 0 0; color: var(--muted); font-size: 16px; }
  main { max-width: 1100px; margin: 0 auto; padding: 8px 16px 60px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 22px; }
  .card { position: relative; display: flex; flex-direction: column; text-decoration: none; color: inherit; background: var(--card); border-radius: 20px; overflow: hidden;
          border: 1px solid rgba(255,255,255,.08); transition: transform .25s, box-shadow .25s; }
  .card:hover, .card:focus-visible { transform: translateY(-6px); box-shadow: 0 18px 40px rgba(0,0,0,.45), 0 0 0 2px var(--accent); outline: none; }
  .art { height: 170px; display: flex; align-items: center; justify-content: center; font-size: 76px; background: var(--grad); position: relative; overflow: hidden; }
  .art::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(115deg, rgba(255,255,255,.06) 0 14px, transparent 14px 28px); }
  .art span { position: relative; z-index: 1; filter: drop-shadow(0 8px 14px rgba(0,0,0,.4)); transition: transform .3s; }
  .card:hover .art span { transform: scale(1.12) rotate(-6deg); }
  .badge { position: absolute; top: 12px; right: 12px; z-index: 2; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 20px; background: rgba(0,0,0,.4); }
  .body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .body h2 { margin: 0; font-size: 22px; }
  .body p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.6; flex: 1; }
  .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: 13px; }
  .best { color: #ffd166; font-weight: 700; }
  .play { background: var(--accent); color: #0b0f24; font-weight: 800; padding: 7px 16px; border-radius: 20px; }
  footer { text-align: center; color: var(--muted); font-size: 13px; padding-bottom: 40px; }
</style>
</head>
<body>
<header>
  <h1>MINI ARCADE</h1>
  <p>골라서 즐기는 6가지 미니 게임</p>
</header>
<main id="list"></main>
<footer>최고 기록은 이 브라우저에 저장됩니다.</footer>
<script>
const GAMES = [
  { href: 'sky-striker.html', icon: '✈️', title: '스카이 스트라이커 3D', badge: '3D 슈팅', desc: '협곡 위를 날며 적 편대와 거대 전함을 격추하세요. 배럴롤로 탄막을 피하고 폭탄으로 위기를 넘기세요.',
    grad: 'linear-gradient(135deg,#1f3577,#f7a477)', accent: '#7fe8ff', key: 'skystriker3d_best', fmt: v => v.toLocaleString() + '점' },
  { href: 'games/breaker.html', icon: '🧱', title: '블록 브레이커', badge: '아케이드', desc: '공을 튕겨 벽돌을 모두 부수세요. 멀티볼, 넓은 패들, 관통탄 아이템으로 콤보를 이어가세요.',
    grad: 'linear-gradient(135deg,#5b1d7a,#ff6bb5)', accent: '#ff7ac6', key: 'breaker_best', fmt: v => v.toLocaleString() + '점' },
  { href: 'games/snake.html', icon: '🐍', title: '네온 스네이크', badge: '클래식', desc: '먹이를 먹을수록 길어지고 빨라집니다. 황금 먹이를 놓치지 말고, 벽 통과 모드도 도전해 보세요.',
    grad: 'linear-gradient(135deg,#0b4d3c,#3dffa8)', accent: '#3dffa8', key: 'snake_best', fmt: v => v.toLocaleString() + '점' },
  { href: 'games/runner.html', icon: '🤖', title: '점프 러너', badge: '러너', desc: '끝없이 달리는 로봇! 점프와 2단 점프, 슬라이딩으로 장애물을 피하고 코인을 모으세요.',
    grad: 'linear-gradient(135deg,#7a3b0b,#ffd166)', accent: '#ffd166', key: 'runner_best', fmt: v => v.toLocaleString() + 'm' },
  { href: 'games/memory.html', icon: '🃏', title: '메모리 매치', badge: '퍼즐', desc: '카드를 뒤집어 같은 그림 짝을 찾으세요. 난이도 3단계, 가장 빠른 기록에 도전하세요.',
    grad: 'linear-gradient(135deg,#123a7a,#8fb8ff)', accent: '#8fb8ff', key: 'memory_best_normal', fmt: v => '보통 ' + (v / 10).toFixed(1) + '초' },
  { href: 'games/farm.html', icon: '🌾', title: '햇살 농장', badge: '경영', desc: '땅을 갈고 씨앗을 심어 물을 주고 수확하세요. 까마귀를 쫓고 밭을 넓혀 매일 목표 수익을 달성하세요.',
    grad: 'linear-gradient(135deg,#2d5a1b,#c8e66b)', accent: '#b6f06b', key: 'farm_best', fmt: v => v.toLocaleString() + '코인' },
];
const list = document.getElementById('list');
for (const g of GAMES) {
  let best = 0; try { best = +localStorage.getItem(g.key) || 0; } catch (e) {}
  const a = document.createElement('a');
  a.className = 'card'; a.href = g.href;
  a.style.setProperty('--grad', g.grad); a.style.setProperty('--accent', g.accent);
  a.innerHTML = `<div class="art"><div class="badge">${g.badge}</div><span>${g.icon}</span></div>
    <div class="body"><h2>${g.title}</h2><p>${g.desc}</p>
    <div class="meta"><span class="best">${best ? '🏆 ' + g.fmt(best) : '기록 없음'}</span><span class="play">플레이 ▶</span></div></div>`;
  list.appendChild(a);
}
</script>
</body>
</html>
